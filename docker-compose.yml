services:
  smartcity-db:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: smartcity-db
    restart: always
    environment:
      - ACCEPT_EULA=1
      - MSSQL_SA_PASSWORD=${SQL_PASSWORD} # Docker pulls this from .env
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql

volumes:
  sql_data: